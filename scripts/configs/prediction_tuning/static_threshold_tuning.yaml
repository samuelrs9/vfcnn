tensorflow:
  gpu_memory_growth: true
voxel_fluid:
  tasks:
    boundary:
      type: classification
      labels:
      - interior
      - boundary
      outputs: 2
    normal:
      type: regression
      outputs: 3
  features:
    occupancy: 1
  approach: sparse_regionwise
  search_radius: 1.5
  grid_length: 0.1
  enable_plot: false
  coarse_prediction: null
prediction:
