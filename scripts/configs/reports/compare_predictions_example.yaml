# Exemplo de configuração para comparar predições
# Novo formato usando 'comparisons'

comparisons:
  # Comparação 1: Predições contra mesmo ground-truth
  - gt_config_file: /work1/voxel-fluid-net/data/3D/simulations/db_blocks_3d_big_res/gt_config.yaml
    pred_config_files:
      - /work1/voxel-fluid-net/data/3D/simulations/db_blocks_3d_big_res/sparse_regionwise_approach/predictions/pred_sparse_voxelized_fluid_cnn_v3_4_100000_1.50_0.10_0_2_kfold3/pred_config.yaml
      - /work1/voxel-fluid-net/data/3D/simulations/db_blocks_3d_big_res/sparse_regionwise_approach/predictions/pred_sparse_voxelized_fluid_cnn_v3_4_100000_1.50_0.10_0_2_kfold3_no_coarse/pred_config.yaml

  # Comparação 2 (opcional): Mesmas predições contra ground-truth alternativo
  # - gt_config_file: /work1/voxel-fluid-net/data/3D/simulations/db_blocks_3d_big_res/gt_config_hdp=1.73.yaml
  #   pred_config_files:
  #     - /work1/voxel-fluid-net/data/3D/big2/db_blocks_3d_big_res/sparse_regionwise_approach/predictions/pred1/pred_config.yaml
  #     - /work1/voxel-fluid-net/data/3D/big2/db_blocks_3d_big_res/sparse_regionwise_approach/predictions/pred2/pred_config.yaml

report:
  output_path: ./reports/predictions_comparison_report
  format: csv
  plot_metrics: false
  print_metrics: true

# Sistema de Cache:
# - Se metrics_report.csv existe no diretório da predição, usa o cache
# - Se não existe, calcula as métricas usando o gt_config_file especificado
# - time_report.csv deve existir (gerado durante predição), caso contrário usa zeros
